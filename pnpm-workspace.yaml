packages:
  - "apps/*"
  - "packages/*"

# the lockfile is our supply-chain trust source; don't reject fresh releases
minimumReleaseAge: 0

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
  - embedded-postgres
  - "@embedded-postgres/windows-x64"
  - "@nestjs/core"
  - "@swc/core"
